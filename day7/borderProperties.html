<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1
        {
            text-align: center;
        }
        .box
        {
            font-size: 30px;
            width: 500px;
            height: 350px;
            margin: 30px auto;
            background-color:antiquewhite;    
        }
        #box1
        {
            border: 10px solid black;
        }
        #box2
        {
            border-right: 10px solid black;
        }
        #box3
        {
            border: 10px double black;
        }
        #box4
        {
           
            border: 10px inset black;
        }
        #box5
        {
            border: 10px outset black;
        }
        #box6
        {
            border-top: 10px solid goldenrod;
            border-right: 10px double firebrick;
            border-bottom: 10px dashed green;
            border-left: 10px dotted darkblue;
        }

    </style>
</head>
<body>
    <h1>Border Properties in CSS</h1>
    <div class="box" id="box1">box1</div>
    <div class="box" id="box2">box2</div>
    <div class="box" id="box3">box3</div>
    <div class="box" id="box4">box4</div>
    <div class="box" id="box5">box5</div>
    <div class="box" id="box6">box6</div>
    <div class="box" id="box7">box7</div>
    <div class="box" id="box8">box8</div>
    <div class="box" id="box9">box9</div>
    <div class="box" id="box10">box10</div>
</body>
</html>
