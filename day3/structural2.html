<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div p:first-child
        {
            background-color: red;
        }
        div p:nth-child(odd)
        {
            background-color: red;
        }
        div p:nth-child(even)
        {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div>
        <p>content1</p>
        <p>content2</p>
        <p>content3</p>
        <p>content4</p>
        <p>content5</p>
        <p>content6</p>
        <p>content7</p>
        <p>content8</p>
        <p>content9</p>
        <p>content10</p>
    </div>
</body>
</html>
