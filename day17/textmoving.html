<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            padding: 0%;
            margin: 0%;
        }
        h1
        {
            color: aliceblue;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            white-space: nowrap;
            animation-name: textMove;
            animation-duration: 4s;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
        }

        div
        {
            width: 100%;
            height: 80px;
            background-color: rgb(179, 22, 22);
            overflow: hidden;
        }

        @keyframes textMove
        {
            from
            {
                transform: translateX(100vw);
            }
            to
            {
                transform: translateX(-125%);
            }
        }
    </style>
</head>
<body>
    <div>
            <h1>🚀sale is live grab the oppertunity🚀 🚀sale is live grab the oppertunity🚀 🚀sale is live grab the oppertunity🚀 🚀sale is live grab the oppertunity🚀</h1>

    </div>
</body>
</html>
