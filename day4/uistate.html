<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:enabled
        {
            background-color: aquamarine;
        }
        input:disabled
        {
            background-color: blueviolet;
        }
        input:checked
        {
            accent-color: red;
        }
        
    </style>
</head>
<body>
    <h1>UI state PCS</h1>

    <input type="text" name="" id="">
<br>
<br>
    <input type="text" value="hello" name="" id="" disabled>
<br>
<br>
    <input type="checkbox" name="" id="" >SKILL
    <input type="radio" name="" id="" checked>GENDER
</body>
</html>
