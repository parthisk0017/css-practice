<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
      }
      img {
        width: 300px;
        filter: drop-shadow(0px 5px 20px rgba(0, 0, 0, 0.3)) grayscale(100%)
          blur(10px);
        transition: all 0.3s linear;
      }
      div {
        width: 100%;
        display: flex;
        justify-content: space-evenly;
      }
      /* div img:nth-child(1) {
        box-shadow: 0px 4px 10px black;
        filter: drop-shadow(0px 5px 20px brown);
      }
      div img:nth-child(2) {
        filter: drop-shadow(0px 4px 15px rgba(0, 0, 0, 0.6));
      } */
      img:hover {
        filter: grayscale(0%) blur(0px);
      }
    </style>
  </head>
  <body>
    <h1>box-shadow Property vs drop-shadow() Function</h1>
    <div>
      <img src="asset/crab.png" alt="" />
      <img src="asset/dog.png" alt="" />
      <img src="asset/snake.png" alt="" />
    </div>
  </body>
</html>
