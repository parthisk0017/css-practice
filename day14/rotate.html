<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        body
        {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            height: 100vh;
        }
        .parent
        {
            width: 70%;
            height: 400px;
            background-color: rgb(225, 204, 14);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border-radius: 3px;
        }
        .box
        {
            width: 300px;
            height: 250px;
            background-color: azure;
            color: black;
            font-size: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            transition: all 3s linear;
            border-radius: 50%;
        }
        #box1:hover
        {
            transform: rotate(360deg);
        }
        #box2:hover
        {
            transform: rotateX(360deg);
        }
        #box3:hover
        {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <h1>Transition: rotate(degree) Property Demo</h1>
    <div class="parent">
        <div class="box" id="box1">rotateZ</div>
        <div class="box" id="box2">rotateX</div>
        <div class="box" id="box3">rotateY</div>
    </div>
</body>
</html>
