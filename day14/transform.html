<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .box 
        {
            width: 200px;
            height: 200px;
            background-color: coral;
            font-size: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            transition: all 5s linear;
        }
        #box1
        {
            transform: translate(400px,100px);
        }
        #box2:hover
        {
            transform: translatex(800px);
        }
        #box3
        {
            transform: translatey(200px);
        }
    </style>
</head>
<body>
    <h1>Transform Property in CSS</h1>
    <div class="box" id="box1">translate(x,y)</div>
    <div class="box" id="box2">translate(x)</div>
    <div class="box" id="box3">translate(y)</div>
</body>
</html>
